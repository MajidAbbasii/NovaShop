# Nginx for NovaShop production (serves prebuilt Frontend static assets and
# proxies API traffic to the NovaShop API Gateway).
#
# Expected Frontend build:  cd frontend && npm ci && npm run build
# (mounts ./frontend/build -> /usr/share/nginx/html)
#
# All /api and /images traffic is forwarded to the gateway (:5250), which
# then proxies to NovaShop.Api (:5000).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # API + gateway-owned paths -> API Gateway
    location ~ ^/(api|images|hangfire|health) {
        proxy_pass http://novashop-api-gateway:5250;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend static assets
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
