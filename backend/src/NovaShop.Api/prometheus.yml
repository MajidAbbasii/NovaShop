# Prometheus configuration for NovaShop API local development
# Used for local dev; the production config lives at the repo root: ./prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "novashop-api-gateway"
    static_configs:
      - targets: ["localhost:5100"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "novashop-api"
    static_configs:
      - targets: ["localhost:5003"]
    metrics_path: /metrics
    scrape_interval: 15s
