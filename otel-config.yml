# ==============================================================================
# OpenTelemetry Collector Configuration for NovaShop
# ==============================================================================
# Receives OTLP metrics/traces from all NovaShop services and exports to:
#   1. Prometheus (internal metrics endpoint for Prometheus scraping)
#   2. Logs to stdout (for debugging)
# ==============================================================================

receivers:
  # OTLP receiver for gRPC (port 4317) — used by all NovaShop services
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver — scrapes internal Prometheus-format metrics
  prometheus:
    config:
      scrape_configs:
        # Self-scrape the OTel collector
        - job_name: "otel-collector"
          scrape_interval: 15s
          static_configs:
            - targets: ["otel-collector:9090"]

exporters:
  # Prometheus exporter — exposes /metrics on port 9090 for Prometheus
  prometheus:
    endpoint: "0.0.0.0:9090"
    namespace: "novashop"
    send_histograms_concisely: true

  # OTLP exporter (optional — for forwarding to external backend)
  otlp:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Logging exporter for debugging
  logging:
    logLevel: debug
    logFormat: json
    sampling:
      enabled: true

processors:
  # Batch processor — groups metrics before export
  batch:
    timeout: 5s
    send_batch_size: 1000

  # Memory limiter — prevents OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Attributes processor — adds service metadata
  attributes:
    actions:
      - key: service
        value: "novashop"
        action: upsert

# ==============================================================================
# Pipeline definitions
# ==============================================================================
service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, memory_limiter, attributes]
      exporters: [prometheus, logging]
    traces:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [logging]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
