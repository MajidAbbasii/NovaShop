# NovaShop Production Docker Compose (app + infra only, no monitoring stack)
# Architecture:
#   Nginx (serves prebuilt Frontend) → API Gateway (:5100) → NovaShop.Api (:5000) → SQL Server + Redis
# NOTE: NovaShop is a 2-service backend (ApiGateway + Api monolith), NOT microservices.
# Do NOT spawn multiple copies of NovaShop.Api — that would duplicate Hangfire
# recurring jobs and create competing workers.

services:
  # NovaShop API (single monolith — all domains)
  novashop-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=NovaShopDb;User Id=sa;Password=${DB_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True
      - REDIS_CONNECTION_STRING=redis:6379
    volumes:
      - images_data:/app/wwwroot/images
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # NovaShop API Gateway (YARP reverse proxy)
  novashop-api-gateway:
    build:
      context: .
      dockerfile: backend/src/NovaShop.ApiGateway/Dockerfile
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_URLS=http://+:5100
      - GATEWAY_URL=http://+:5100
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=NovaShopDb;User Id=sa;Password=${DB_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True
      - REDIS_CONNECTION_STRING=redis:6379
      # Override YARP backend cluster address so the gateway proxies to the
      # API container (compose DNS) instead of localhost (which is the gateway itself in Docker).
      - ReverseProxy__Clusters__backend-cluster__Destinations__destination1__Address=http://novashop-api:5000
    depends_on:
      - novashop-api
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - novashop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD:-YourStrong!Passw0rd}", "-C", "-Q", "SELECT 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novashop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx serves the prebuilt Frontend static build.
  # Build the frontend first: cd frontend && npm ci && npm run build
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - novashop-api-gateway
    restart: unless-stopped
    networks:
      - novashop-net

volumes:
  sqlserver_data:
  redis_data:
  images_data:

networks:
  novashop-net:
    driver: bridge
