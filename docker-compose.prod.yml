# NovaShop Production Docker Compose (app + infra only, no monitoring stack)
# Architecture:
#   Nginx (serves prebuilt Frontend) -> API Gateway (:5250) -> NovaShop.Api (:5000) -> PostgreSQL + Redis
# NOTE: NovaShop is a 2-service backend (ApiGateway + Api monolith), NOT microservices.
# Do NOT spawn multiple copies of NovaShop.Api — that would duplicate Hangfire
# recurring jobs and create competing workers.

services:
  # NovaShop API (single monolith — all domains)
  novashop-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NovaShopDb;Username=novashop;Password=${DB_PASSWORD:-novashop};TrustServerCertificate=true
      - REDIS_CONNECTION_STRING=redis:6379
    volumes:
      - images_data:/app/wwwroot/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # NovaShop API Gateway (YARP reverse proxy)
  novashop-api-gateway:
    build:
      context: .
      dockerfile: backend/src/NovaShop.ApiGateway/Dockerfile
    ports:
      - "5250:5250"
    environment:
      - ASPNETCORE_URLS=http://+:5250
      - GATEWAY_URL=http://+:5250
      - API_BASE_URL=http://novashop-api:5000
      - ASPNETCORE_ENVIRONMENT=Production
      # Override YARP backend cluster address so the gateway proxies to the
      # API container (compose DNS) instead of localhost (which is the gateway itself in Docker).
      - ReverseProxy__Clusters__backend-cluster__Destinations__destination1__Address=http://novashop-api:5000
      - REDIS_CONNECTION_STRING=redis:6379
    depends_on:
      - novashop-api
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5250/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=NovaShopDb
      - POSTGRES_USER=novashop
      - POSTGRES_PASSWORD=${DB_PASSWORD:-novashop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novashop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novashop -d NovaShopDb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novashop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx serves the prebuilt Frontend static build.
  # Build the frontend first: cd frontend && npm ci && npm run build
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - novashop-api-gateway
    restart: unless-stopped
    networks:
      - novashop-net

volumes:
  postgres_data:
  redis_data:
  images_data:

networks:
  novashop-net:
    driver: bridge
