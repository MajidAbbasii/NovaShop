# NovaShop Deployment Docker Compose
# Architecture:
#   Frontend (Next.js) -> API Gateway (:5100) -> NovaShop.Api (:5000) -> PostgreSQL + Redis
# NOTE: NovaShop is a 2-service backend (ApiGateway + Api monolith), NOT microservices.
# Do NOT spawn multiple copies of NovaShop.Api — that would duplicate Hangfire
# recurring jobs and create competing workers.

services:
  # NovaShop API (single monolith — hosts all domains: products, orders, cart,
  # auth, wishlist, reviews, discounts, admin, notifications, etc.)
  novashop-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=NovaShopDb;Username=novashop;Password=${DB_PASSWORD:-novashop};TrustServerCertificate=true
      - REDIS_CONNECTION_STRING=redis:6379
      - OTEL_SERVICE_NAME=novashop-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - images_data:/app/wwwroot/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # NovaShop API Gateway (YARP reverse proxy + JWT validation + CORS + rate limiting)
  novashop-api-gateway:
    build:
      context: .
      dockerfile: backend/src/NovaShop.ApiGateway/Dockerfile
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_URLS=http://+:5100
      - GATEWAY_URL=http://+:5100
      - ASPNETCORE_ENVIRONMENT=Production
      # Override YARP backend cluster address so the gateway proxies to the
      # API container (compose DNS) instead of localhost (which is the gateway itself in Docker).
      - ReverseProxy__Clusters__backend-cluster__Destinations__destination1__Address=http://novashop-api:5000
      - OTEL_SERVICE_NAME=novashop-api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - novashop-api
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=NovaShopDb
      - POSTGRES_USER=novashop
      - POSTGRES_PASSWORD=${DB_PASSWORD:-novashop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novashop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novashop -d NovaShopDb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novashop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: novashop-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus metrics endpoint
    volumes:
      - ./otel-config.yml:/etc/otel-collector-config.yml:ro
    environment:
      - OTEL_SERVICE_NAME=otel-collector
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.type=otel-collector"
      - "monitoring.scrape=otel-collector"

  # Prometheus Monitoring Server
  prometheus:
    image: prom/prometheus:latest
    container_name: novashop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/consoles'
      - '--web.enable-admin-api'
      - '--web.enable-lifecycle'
    depends_on:
      - novashop-api-gateway
      - novashop-api
      - otel-collector
      - alertmanager
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "monitoring.type=prometheus"
      - "monitoring.scrape.prometheus=true"

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: novashop-alertmanager
    ports:
      - "9100:9100"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.type=alertmanager"

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: novashop-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - otel-collector
      - alertmanager
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "monitoring.type=grafana"
      - "monitoring.scrape=grafana"

  # Node Exporter for host system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: novashop-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/rootfs'
    volumes:
      - /:/rootfs:ro
      - /proc:/proc:ro
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.type=node-exporter"
      - "monitoring.scrape=node-exporter"

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: novashop-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.type=cadvisor"
      - "monitoring.scrape=cadvisor"

volumes:
  postgres_data:
  redis_data:
  images_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  novashop-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
      com.docker.network.driver.name: novashop-network
