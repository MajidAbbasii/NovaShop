# NovaShop Monitoring Infrastructure Docker Compose
version: '3.8'

services:
  # NovaShop API Gateway Service
  novashop-api-gateway:
    build:
      context: .
      dockerfile: backend/src/NovaShop.ApiGateway/Dockerfile
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_URLS=http://+:5100
      - CONN_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - REDIS_CONNECTION_STRING=redis:6379
      - OTEL_SERVICE_NAME=novashop-api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - product-api
      - category-api
      - order-api
      - cart-api
      - wishlist-api
      - review-api
      - auth-api
      - discount-api
      - redis
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # Product API Service
  product-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - REDIS_CONNECTION_STRING=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_SERVICE_NAME=product-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - sqlserver
      - redis
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # Category API Service
  category-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_SERVICE_NAME=category-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # Order API Service
  order-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_SERVICE_NAME=order-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # Cart API Service
  cart-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_SERVICE_NAME=cart-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # Wishlist API Service
  wishlist-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_SERVICE_NAME=wishlist-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # Review API Service
  review-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_SERVICE_NAME=review-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # Auth API Service
  auth-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_SERVICE_NAME=auth-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # Discount API Service
  discount-api:
    build:
      context: .
      dockerfile: backend/src/NovaShop.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - CONNECTION_STRING=Server=localhost;Database=master;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_SERVICE_NAME=discount-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.enabled=true"
      - "monitoring.scrape=true"
      - "monitoring.metrics-endpoint=/metrics"

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - novashop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql/tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd", "-Q", "SELECT 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novashop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # OpenTelemetry Collector
  # Receives OTLP metrics/traces from all services, exposes Prometheus endpoint on :9090
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: novashop-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus metrics endpoint (for OTel self-metrics)
    volumes:
      - ./otel-config.yml:/etc/otel-collector-config.yml:ro
    environment:
      - OTEL_SERVICE_NAME=otel-collector
    depends_on:
      - redis
      - sqlserver
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.type=otel-collector"
      - "monitoring.scrape=otel-collector"

  # Prometheus Monitoring Server
  prometheus:
    image: prom/prometheus:latest
    container_name: novashop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/consoles'
      - '--web.enable-admin-api'
      - '--web.enable-lifecycle'
    depends_on:
      - novashop-api-gateway
      - product-api
      - auth-api
      - otel-collector
      - alertmanager
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "monitoring.type=prometheus"
      - "monitoring.scrape.prometheus=true"

  # Alertmanager (handles Prometheus alerts)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: novashop-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - novashop-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "monitoring.type=alertmanager"

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: novashop-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - otel-collector
      - alertmanager
    restart: unless-stopped
    networks:
      - novashop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "monitoring.type=grafana"
      - "monitoring.scrape=grafana"

  # Node Exporter for host system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: novashop-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/rootfs'
    volumes:
      - /:/rootfs:ro
      - /proc:/proc:ro
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.type=node-exporter"
      - "monitoring.scrape=node-exporter"

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: novashop-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - novashop-net
    labels:
      - "monitoring.type=cadvisor"
      - "monitoring.scrape=cadvisor"

volumes:
  sqlserver_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  novashop-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
      com.docker.network.driver.name: novashop-network
