# Prometheus configuration for NovaShop monitoring
# Scrapes metrics from all services running in Docker compose
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "novashop-monitor"

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alerting rules
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # API Gateway (YARP reverse proxy)
  - job_name: "novashop-api-gateway"
    static_configs:
      - targets: ["novashop-api-gateway:5100"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # NovaShop API (all endpoint services share same image, differentiated by OTEL_SERVICE_NAME)
  - job_name: "novashop-api"
    static_configs:
      - targets:
          - "product-api:80"
          - "category-api:80"
          - "order-api:80"
          - "cart-api:80"
          - "wishlist-api:80"
          - "review-api:80"
          - "auth-api:80"
          - "discount-api:80"
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      # Use OTEL_SERVICE_NAME env var as the instance label
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      # Add service name from the target hostname
      - source_labels: [__address__]
        regex: "([^.-]+)-api.*"
        target_label: service
        replacement: "$1-api"

  # OpenTelemetry Collector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9090"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Node Exporter (host system metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: /metrics
    scrape_interval: 15s

  # cAdvisor (container metrics)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics
    scrape_interval: 15s
    # cAdvisor needs auth in some setups; adjust if needed
    honor_timestamps: true

  # Grafana (self-monitoring)
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics
    scrape_interval: 15s
